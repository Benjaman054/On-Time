<svg xmlns="http://www.w3.org/2000/svg" width="300" height="620" viewBox="0 0 300 620" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <clipPath id="scrA"><rect x="12" y="12" width="276" height="596" rx="30"/></clipPath>
  </defs>
  <rect x="6" y="6" width="288" height="608" rx="36" fill="#111827"/>
  <rect x="12" y="12" width="276" height="596" rx="30" fill="#F3F4F6"/>
  <g clip-path="url(#scrA)">
    <rect x="12" y="12" width="276" height="70" fill="#FFFFFF"/>
    <text x="30" y="42" font-size="13" font-weight="600" fill="#111827">9:41</text>
    <text x="248" y="42" font-size="12" fill="#111827">▤ ▮</text>
    <text x="30" y="72" font-size="18" font-weight="700" fill="#111827">☰   Add meeting</text>

    <!-- Title field -->
    <text x="28" y="118" font-size="12" fill="#6B7280">Title</text>
    <rect x="28" y="126" width="244" height="46" rx="12" fill="#FFFFFF" stroke="#E5E7EB"/>
    <text x="44" y="154" font-size="14" fill="#111827">Kickoff with Yagden</text>

    <!-- Location field -->
    <text x="28" y="196" font-size="12" fill="#6B7280">Location</text>
    <rect x="28" y="204" width="244" height="46" rx="12" fill="#FFFFFF" stroke="#E5E7EB"/>
    <text x="44" y="232" font-size="14" fill="#111827">📍 Sarona Market, Tel Aviv</text>

    <!-- Date + Time row -->
    <text x="28" y="274" font-size="12" fill="#6B7280">Date</text>
    <rect x="28" y="282" width="116" height="46" rx="12" fill="#FFFFFF" stroke="#E5E7EB"/>
    <text x="44" y="310" font-size="14" fill="#111827">📅  Sat 23 Aug</text>

    <text x="156" y="274" font-size="12" fill="#6B7280">Time</text>
    <rect x="156" y="282" width="116" height="46" rx="12" fill="#FFFFFF" stroke="#E5E7EB"/>
    <text x="172" y="310" font-size="14" fill="#111827">⏰  8:00 pm</text>

    <!-- Save button -->
    <rect x="28" y="366" width="244" height="52" rx="12" fill="#2563EB"/>
    <text x="150" y="398" text-anchor="middle" font-size="16" font-weight="600" fill="#FFFFFF">Add to my calendar</text>

    <text x="150" y="446" text-anchor="middle" font-size="11.5" fill="#9CA3AF">We'll add it to Google Calendar and</text>
    <text x="150" y="462" text-anchor="middle" font-size="11.5" fill="#9CA3AF">compute your leave-by time.</text>
  </g>
</svg>
