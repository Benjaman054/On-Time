    <rect x="12" y="12" width="276" height="70" fill="#FFFFFF"/>
    <text x="30" y="42" font-size="13" font-weight="600" fill="#111827">9:41</text>
    <text x="248" y="42" font-size="12" fill="#111827">▤ ▮</text>
