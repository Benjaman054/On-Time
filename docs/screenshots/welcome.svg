<svg xmlns="http://www.w3.org/2000/svg" width="300" height="620" viewBox="0 0 300 620" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <clipPath id="scr"><rect x="12" y="12" width="276" height="596" rx="30"/></clipPath>
  </defs>
  <rect x="6" y="6" width="288" height="608" rx="36" fill="#111827"/>
  <rect x="12" y="12" width="276" height="596" rx="30" fill="#FFFFFF"/>
  <g clip-path="url(#scr)">
    <!-- status bar -->
    <text x="30" y="42" font-size="13" font-weight="600" fill="#111827">9:41</text>
    <text x="248" y="42" font-size="12" fill="#111827">▤ ▮</text>

    <!-- robot logo badge -->
    <g transform="translate(105,120)">
      <rect x="0" y="0" width="90" height="90" rx="22" fill="#EAF2FF"/>
      <rect x="20" y="24" width="50" height="42" rx="12" fill="#FFFFFF" stroke="#2563EB" stroke-width="3"/>
      <line x1="45" y1="14" x2="45" y2="24" stroke="#2563EB" stroke-width="3"/>
      <circle cx="45" cy="12" r="4" fill="#2563EB"/>
      <circle cx="36" cy="42" r="4.5" fill="#2563EB"/>
      <circle cx="54" cy="42" r="4.5" fill="#2563EB"/>
      <path d="M36 52 Q45 60 54 52" stroke="#2563EB" stroke-width="3" fill="none" stroke-linecap="round"/>
    </g>

    <!-- wordmark -->
    <text x="150" y="258" text-anchor="middle" font-size="34" font-weight="800" fill="#2563EB">ON<tspan fill="#111827" font-weight="300">-Time</tspan></text>
    <text x="150" y="286" text-anchor="middle" font-size="15" fill="#6B7280">Leave on time, every time.</text>

    <!-- sign in button -->
    <rect x="30" y="470" width="240" height="52" rx="12" fill="#2563EB"/>
    <text x="150" y="502" text-anchor="middle" font-size="16" font-weight="600" fill="#FFFFFF">Sign in with Google</text>

    <text x="150" y="556" text-anchor="middle" font-size="11.5" fill="#9CA3AF">We only read your calendar to tell</text>
    <text x="150" y="572" text-anchor="middle" font-size="11.5" fill="#9CA3AF">you when to leave.</text>
  </g>
</svg>
